<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A apărut o eroare · Glow Diary by Deea</title>
<!--
  Pagină independentă, fără {% extends "base.html" %} — handler-ul 500
  implicit al Django randează acest template FĂRĂ context (nici măcar
  `request`), ca o eroare la randarea shell-ului comun (context
  processors, nav activă etc.) să nu strice și pagina de eroare. Stilul
  e totuși aliniat manual la restul site-ului (fonturi, culori, formă
  de buton), ca vizitatoarea să nu simtă că a ajuns pe alt site.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{
    margin:0;background:#F7E4DD;color:#7A1E3D;
    font-family:'DM Sans', -apple-system, Segoe UI, Roboto, sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:24px;box-sizing:border-box;
  }
  .card{
    max-width:420px;background:#FFF7F0;border-radius:30px;
    padding:32px;text-align:center;box-shadow:0 12px 0 rgba(122,30,61,0.06);
  }
  .logo{
    font-family:'Fraunces';font-weight:800;font-size:19px;
    color:#FF6FA5;margin-bottom:14px;
  }
  .logo span{color:#7A1E3D;}
  h1{font-family:'Fraunces';font-weight:700;font-size:20px;margin:0 0 10px;}
  p{font-size:14px;line-height:1.6;opacity:0.8;margin:0 0 20px;}
  a{
    display:inline-block;background:#FF6FA5;color:#fff;text-decoration:none;
    border-radius:100px;padding:11px 24px;font-size:13px;font-weight:700;
    font-family:'Fraunces';
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">glow<span>diary</span></div>
    <h1>Ceva n-a mers cum trebuie 🙈</h1>
    <p>Am fost anunțată automat despre asta. Încearcă din nou în câteva minute.</p>
    <a href="/">Înapoi acasă</a>
  </div>
</body>
</html>
