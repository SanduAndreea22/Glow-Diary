{% if is_paginated %}
<nav class="pagination" id="pagination-nav" aria-label="Paginare">
  {% if page_obj.has_previous %}
  <a href="?page={{ page_obj.previous_page_number }}{{ querystring_extra }}" class="page-arrow" aria-label="Pagina anterioară">&larr;</a>
  {% else %}
  <span class="page-arrow disabled">&larr;</span>
  {% endif %}

  {% for num in page_range %}
    {% if num == page_obj.paginator.ELLIPSIS %}
    <span class="page-ellipsis">…</span>
    {% else %}
    <a href="?page={{ num }}{{ querystring_extra }}" class="page-pill{% if num == page_obj.number %} active{% endif %}">{{ num }}</a>
    {% endif %}
  {% endfor %}

  {% if page_obj.has_next %}
  <a href="?page={{ page_obj.next_page_number }}{{ querystring_extra }}" class="page-arrow" aria-label="Pagina următoare">&rarr;</a>
  {% else %}
  <span class="page-arrow disabled">&rarr;</span>
  {% endif %}
</nav>
{% endif %}
